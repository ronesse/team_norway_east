<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Team Norway East – RIG Falköping 4.–6. sept 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0b2d59;
  --blue:#0a5fe8;
  --red:#d61f2c;
  --green:#18863b;
  --orange:#f06a00;
  --text:#15213d;
  --muted:#607086;
  --line:#dfe5ec;
  --card:#fff;
  --soft:#f6f8fb;
  --shadow:0 4px 18px rgba(20,43,82,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:#f4f6f9;
  padding-bottom:74px;
}
a{color:inherit}
.container{max-width:760px;margin:auto}

header{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:14px 14px 12px;
}
.head-row{
  display:grid;
  grid-template-columns:118px 1fr auto;
  gap:13px;
  align-items:center;
}
.logo{
  width:118px;
  max-height:96px;
  object-fit:contain;
  display:block;
}
.trip-title{
  line-height:1.05;
}
.trip-title h1{
  margin:0;
  font-size:clamp(1.45rem,6vw,2.2rem);
  color:var(--navy);
  letter-spacing:-.035em;
}
.trip-date{
  margin-top:8px;
  color:var(--red);
  font-size:1rem;
  font-weight:800;
}
.menu-btn{
  border:0;
  background:transparent;
  color:var(--navy);
  font-size:1.8rem;
  padding:6px;
  cursor:pointer;
}
.quick-menu{
  display:none;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--line);
  gap:7px;
  flex-wrap:wrap;
}
.quick-menu.show{display:flex}
.quick-menu a{
  text-decoration:none;
  background:#f1f5fa;
  padding:8px 10px;
  border-radius:10px;
  font-size:.86rem;
  font-weight:750;
  color:var(--navy);
}

main{padding:14px}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
  overflow:hidden;
}
.pad{padding:15px}
.hero-card{
  display:grid;
  grid-template-columns:44px 1fr;
  gap:12px;
  align-items:start;
}
.icon-circle{
  width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#0b78ff,#1246d8);
  color:#fff;font-size:1.25rem;
}
h2,h3{margin:0;color:var(--navy)}
h2{font-size:1.16rem}
h3{font-size:1rem}
.small{font-size:.88rem;color:var(--muted);line-height:1.45}
.cta-row{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  border:0;border-radius:11px;padding:11px 14px;
  font-weight:800;font-size:.9rem;cursor:pointer;text-decoration:none;
}
.btn.primary{background:linear-gradient(135deg,#0a6af4,#194bd0);color:#fff}
.btn.secondary{background:#edf3fb;color:var(--navy);border:1px solid #cdd8e5}
.btn.smallbtn{padding:8px 10px;font-size:.82rem}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field.full{grid-column:1/-1}
label{display:block;font-size:.78rem;font-weight:800;color:#3e4d64;margin:0 0 4px}
input,select,textarea{
  width:100%;padding:10px 11px;
  border:1px solid #ccd6e1;border-radius:10px;
  font:inherit;color:var(--text);background:#fff;
}
textarea{min-height:65px;resize:vertical}
.status-msg{margin-top:9px;font-size:.84rem;min-height:18px}
.ok{color:var(--green);font-weight:800}
.err{color:#b42318;font-weight:800}

.section-head{
  display:flex;justify-content:space-between;gap:10px;align-items:center;
  padding:13px 14px 10px;border-bottom:1px solid var(--line)
}
.section-head .count{font-size:.8rem;color:var(--muted)}

.response-list{list-style:none;margin:0;padding:0}
.response-item{
  display:grid;
  grid-template-columns:26px minmax(0,1.6fr) .8fr .9fr;
  gap:8px;
  align-items:center;
  padding:10px 14px;
  border-top:1px solid #edf0f4;
  font-size:.86rem;
}
.response-item:first-child{border-top:0}
.status-icon{
  width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;font-size:.74rem;font-weight:900;
  border:2px solid #98a2b3;color:#98a2b3;
}
.status-icon.done{border-color:var(--green);color:var(--green)}
.status-icon.wait{border-color:var(--orange);color:var(--orange)}
.person-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person-time{font-weight:800;color:var(--green);text-align:right;white-space:nowrap}
.person-place{color:#4c5a70;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.missing{color:#8a94a4;font-weight:600}
.more-row{
  padding:11px 14px;
  border-top:1px solid var(--line);
  color:var(--blue);
  font-size:.86rem;
  font-weight:800;
  cursor:pointer;
}

.compact-table{width:100%;border-collapse:collapse}
.compact-table th,.compact-table td{
  padding:9px 12px;border-top:1px solid #edf0f4;text-align:left;font-size:.86rem
}
.compact-table th{background:#f7f9fb;color:var(--navy);font-size:.76rem;text-transform:uppercase;letter-spacing:.03em}
.compact-table tr:first-child th{border-top:0}
.compact-table a{color:var(--blue);text-decoration:none;font-weight:700}

.program-day{padding:0 14px 10px}
.program-day h3{padding:12px 0 6px}
.program-row{
  display:grid;grid-template-columns:48px 1fr;
  gap:8px;padding:7px 0;border-top:1px solid #eef1f4;font-size:.85rem
}
.program-row:first-of-type{border-top:0}
.program-time{font-weight:900;color:var(--blue)}
.program-match{color:var(--red);font-weight:800}

.car-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.car-box{background:#f7f9fb;border-radius:12px;padding:10px}
.car-box strong{display:block;color:var(--navy);font-size:.88rem}
.car-box span{font-size:.79rem;color:var(--muted)}

.notice{background:#fff8e8;color:#6c4b00;padding:10px 12px;border-radius:10px;font-size:.82rem;margin-top:10px}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--navy);color:#fff;
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  box-shadow:0 -5px 18px rgba(0,0,0,.15);
}
.bottom-nav a{
  text-decoration:none;text-align:center;font-size:.71rem;color:#e5edf9;
}
.bottom-nav .ico{display:block;font-size:1.15rem;margin-bottom:2px}
.bottom-nav a.active{color:#fff;font-weight:800}

.hidden{display:none!important}

@media(max-width:560px){
  .head-row{grid-template-columns:102px 1fr auto;gap:10px}
  .logo{width:102px;max-height:82px}
  .trip-title h1{font-size:1.45rem}
  .trip-date{font-size:.92rem}
  main{padding:10px}
  .card{border-radius:14px;margin-bottom:10px}
  .pad{padding:13px}
  .response-item{grid-template-columns:24px minmax(0,1.55fr) .75fr .8fr;padding:9px 11px;font-size:.8rem}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .car-grid{grid-template-columns:1fr}
}

.focus-card{border:2px solid #c8d7ea;box-shadow:0 8px 28px rgba(11,45,89,.14)}
.car-focus-head{background:linear-gradient(135deg,#0b2d59,#124b88);color:#fff;border-bottom:0}
.car-focus-head h2{color:#fff}.car-focus-head .small{color:#dce9f7}
.focus-card .car-grid{padding-top:10px}
.focus-card .car-box{background:#f7faff;border:1px solid #d6e2ef}
.focus-card .car-box strong{font-size:.94rem;margin-bottom:3px}
@media(max-width:560px){.focus-card .car-grid{gap:7px}.focus-card .car-box{padding:11px}}


/* Mobiltilpasning av spillertropp */
#spillertropp td:nth-child(2),
#spillertropp th:nth-child(2),
#spillertropp td:nth-child(2) a {
  white-space: nowrap;
}
#spillertropp td:nth-child(2) a {
  display: inline-block;
}
@media (max-width:560px) {
  #spillertropp .compact-table th,
  #spillertropp .compact-table td {
    padding: 9px 8px;
    font-size: .80rem;
  }
  #spillertropp .compact-table th {
    font-size: .70rem;
  }
  #spillertropp td:first-child { width: 43%; }
  #spillertropp td:nth-child(2) { width: 35%; }
  #spillertropp td:nth-child(3) { width: 22%; }
}

.program-focus{border:2px solid #c8d7ea;box-shadow:0 8px 28px rgba(11,45,89,.14)}
.program-focus-head{background:linear-gradient(135deg,#0b2d59,#124b88);color:#fff;border-bottom:0}
.program-focus-head h2{color:#fff}.program-focus-head .small{color:#dce9f7}
.program-focus .program-day:nth-of-type(2){margin:8px;padding:0 10px 10px;border:2px solid #d7e5f4;border-radius:12px;background:#f7faff}
.today-focus{display:inline-block;margin-left:6px;padding:3px 7px;border-radius:999px;background:#e7f0ff;color:#0a5fe8;font-size:.68rem;vertical-align:middle}

</style>
</head>
